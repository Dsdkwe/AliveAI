name: Unity Build Android

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'unity/**'
      - '.github/workflows/unity-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-${{ runner.os }}-2022.3.22f1-${{ hashFiles('unity/Packages/manifest.json') }}
          restore-keys: |
            Library-${{ runner.os }}-2022.3.22f1-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: unity
          targetPlatform: Android
          buildMethod: BuildScript.PerformBuild

      - uses: actions/upload-artifact@v4
        with:
          name: HTA-Android
          path: build
