name: Unity Request License

on:
  workflow_dispatch: {}

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate .alf
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            unityci/editor:ubuntu-2022.3.22f1-android-3.1.0 \
            /opt/unity/Editor/Unity -batchmode -nographics -createManualActivationFile -quit \
            -logFile /workspace/alf.log || true
          echo "---- Unity 日志 ----"
          tail -n 30 /workspace/alf.log || true
          echo "---- 生成的 .alf ----"
          ls -la /workspace/*.alf || true
      - name: Upload .alf
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Unity-license-alf
          path: |
            *.alf
            **/*.alf
          if-no-files-found: error
